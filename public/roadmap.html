<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Древо развития</title>
<link rel="stylesheet" href="style.css">
<style>
  .roadmap-layout{display:grid;grid-template-columns:1fr 380px;gap:2rem;max-width:1350px;margin:2rem auto;padding:0 1rem}
  @media(max-width:980px){.roadmap-layout{grid-template-columns:1fr}}
  .skill-tier{background:#FFF;border:1px solid var(--border-color);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
  .skill-tier h3{margin-bottom:1rem;color:var(--text-main);font-size:1.15rem;display:flex;align-items:center;gap:.5rem}
  .skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
  .skill-node{background:#F8FAFC;border:1px solid var(--border-color);border-radius:10px;padding:1.1rem;display:flex;flex-direction:column;justify-content:space-between}
  .skill-node.completed{border-color:#10B981;background:#ECFDF5}
  .node-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
  .node-level{font-size:.75rem;background:#E2E8F0;padding:2px 6px;border-radius:4px;color:#334155;font-weight:600}
  .mascot-panel{background:#FFF;border:1px solid var(--border-color);border-radius:16px;padding:1.8rem;text-align:center;position:sticky;top:2rem}
  .mascot-img-container{width:220px;height:220px;margin:0 auto 1.2rem;background:#F1F5F9;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-color);overflow:hidden}
  .mascot-img-container img{width:100%;height:100%;object-fit:cover;transition:transform .2s ease}
  .level-badge{background:#1D3557;color:#fff;padding:.4rem 1rem;border-radius:20px;font-weight:600;display:inline-block;margin-bottom:.8rem;font-size:.9rem}
  .fish-counter{background:#F1F5F9;color:#047857;padding:.4rem .9rem;border-radius:12px;font-weight:600;display:inline-block;margin-bottom:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <div class="nav-container">
    <a class="logo-placeholder" style="background-image:url(logo2.png);background-size:cover" href="index.html"></a>
    <div style="display:flex;gap:1.2rem;align-items:center;font-size:.95rem">
      <span>Уровень: <strong id="user-level" style="color:#1D3557">1</strong></span>
      <span>XP: <strong id="user-xp">0</strong></span>
      <span>🐟 Рыба: <strong id="user-fish">3</strong></span>
      <a href="quiz.html" class="btn btn-outline" style="padding:.4rem .8rem">Тест</a>
      <a href="index.html" class="btn btn-primary" style="padding:.4rem .8rem">Выход</a>
    </div>
  </div>
</header>

<main class="roadmap-layout">
  <div>
    <div style="background:#FFF;border:1px solid var(--border-color);border-radius:12px;padding:1.2rem;margin-bottom:2rem">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:.9rem">
        <span>Прогресс уровня <strong id="current-lvl-text">Уровень 1</strong></span>
        <span id="xp-progress-text" style="color:var(--text-muted)">0 / 400 XP</span>
      </div>
      <div style="background:#E2E8F0;border-radius:6px;height:10px;width:100%;overflow:hidden">
        <div id="user-xp-bar" style="background:#1D3557;height:100%;width:0%;transition:width .4s"></div>
      </div>
    </div>
    <section style="margin-bottom:2.5rem">
      <h2 style="font-size:1.4rem;margin-bottom:1rem">Ежедневные квесты</h2>
      <div id="daily-tasks-container" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem"></div>
    </section>
    <section>
      <h2 style="font-size:1.4rem;margin-bottom:1rem">Древо развития (Путь к университету)</h2>
      <div id="skill-tree-container" style="color:var(--text-muted)">Загрузка древа развития...</div>
    </section>
  </div>

  <aside>
    <div class="mascot-panel">
      <h3 style="margin-bottom:.3rem">Питомец Виктор</h3>
      <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:1rem">Кормите его рыбой за уровни и выполнение квестов.</p>
      <div class="mascot-img-container">
        <img id="mascot-image" src="viktor.png" alt="Виктор">
      </div>
      <div class="level-badge">Уровень Виктора: <span id="victor-lvl">1</span></div>
      <div><span class="fish-counter">🐟 Рыбы в запасе: <span id="fish-count">3</span></span></div>
      <div style="margin-bottom:1.2rem;text-align:left">
        <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted);margin-bottom:4px">
          <span>Сытость Виктора</span><span id="hunger-text">50%</span>
        </div>
        <div style="background:#E2E8F0;border-radius:6px;height:10px;width:100%;overflow:hidden">
          <div id="hunger-bar" style="background:#10B981;height:100%;width:50%;transition:width .3s,background-color .3s"></div>
        </div>
      </div>
      <button id="feed-btn" class="btn btn-primary" style="width:100%;font-weight:600">Покормить Виктора (-1 🐟)</button>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
let userId = localStorage.getItem('userId');
let userXP = localStorage.getItem('userXP') !== null ? +localStorage.getItem('userXP') : 120;
let userFish = localStorage.getItem('userFish') !== null ? +localStorage.getItem('userFish') : 3;
let hunger = localStorage.getItem('mascotHunger') !== null ? +localStorage.getItem('mascotHunger') : 50;
let doneTasks = JSON.parse(localStorage.getItem('doneTasks') || '[]');
let lastLevel = Math.floor(userXP / 400) + 1;
let tasksData = [], feedTimer = null, isFeeding = false;

function updateMascotSprite(feeding = false) {
  const img = $('mascot-image');
  if (!img) return;
  if (feeding) {
    isFeeding = true;
    img.src = 'viktor3.png';
    img.style.transform = 'scale(1.05)';
    clearTimeout(feedTimer);
    feedTimer = setTimeout(() => {
      isFeeding = false;
      img.style.transform = 'scale(1)';
      updateMascotSprite(false);
    }, 2000);
    return;
  }
  if (!isFeeding) img.src = hunger <= 20 ? 'viktor2.png' : 'viktor.png';
}

async function init() {
  try {
    const res = await fetch('/api/roadmap-tasks');
    tasksData = await res.json();
  } catch (e) { console.error(e); }
  updateUI();
}

function updateUI() {
  const lvl = Math.floor(userXP / 400) + 1;
  if (lvl > lastLevel) {
    const bonus = lvl - lastLevel;
    userFish += bonus;
    alert(`Поздравляем! Достигнут ${lvl} уровень! Получено рыбы: +${bonus} 🐟`);
    lastLevel = lvl;
  }
  const xpInLvl = userXP % 400;
  $('user-level').textContent = $('victor-lvl').textContent = lvl;
  $('current-lvl-text').textContent = `Уровень ${lvl}`;
  $('user-xp').textContent = userXP;
  $('xp-progress-text').textContent = `${xpInLvl} / 400 XP`;
  $('user-xp-bar').style.width = `${(xpInLvl / 400) * 100}%`;
  $('user-fish').textContent = $('fish-count').textContent = userFish;

  const bar = $('hunger-bar');
  bar.style.width = hunger + '%';
  bar.style.backgroundColor = hunger <= 20 ? '#EF4444' : '#10B981';
  $('hunger-text').textContent = hunger + '%';
  updateMascotSprite(false);

  localStorage.setItem('userXP', userXP);
  localStorage.setItem('userFish', userFish);
  localStorage.setItem('mascotHunger', hunger);
  localStorage.setItem('doneTasks', JSON.stringify(doneTasks));

  if (userId) {
    fetch('/api/save-progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: +userId, xp: userXP, fish: userFish, hunger, doneTasks })
    }).catch(console.error);
  }
  renderTree();
}

function renderTree() {
  $('daily-tasks-container').innerHTML = tasksData.filter(t => t.is_daily).map(t => {
    const done = doneTasks.includes(t.id);
    return `<div class="skill-node ${done ? 'completed' : ''}">
      <div><div class="node-header"><span class="node-level">Ежедневно</span><span style="color:#047857;font-size:.8rem;font-weight:600">+${t.xp} XP +🐟</span></div><strong style="font-size:.9rem">${t.title}</strong></div>
      <button class="btn ${done ? 'btn-outline' : 'btn-primary'}" style="margin-top:.8rem;padding:.3rem;font-size:.8rem" onclick="completeTask('${t.id}',${t.xp},1)" ${done ? 'disabled' : ''}>${done ? 'Выполнено' : 'Выполнить'}</button>
    </div>`;
  }).join('');

  const tiers = {};
  tasksData.filter(t => !t.is_daily).forEach(t => (tiers[t.tier_title] = tiers[t.tier_title] || []).push(t));
  $('skill-tree-container').innerHTML = Object.keys(tiers).map(title => `
    <div class="skill-tier"><h3>${title}</h3><div class="skill-grid">
      ${tiers[title].map(t => {
        const done = doneTasks.includes(t.id);
        return `<div class="skill-node ${done ? 'completed' : ''}">
          <div><div class="node-header"><span class="node-level">Шаг ${t.task_index}</span><span style="color:#1D3557;font-size:.8rem;font-weight:600">+${t.xp} XP</span></div><strong style="font-size:.9rem">${t.title}</strong></div>
          <button class="btn ${done ? 'btn-outline' : 'btn-primary'}" style="margin-top:.8rem;padding:.3rem;font-size:.8rem" onclick="completeTask('${t.id}',${t.xp},0)" ${done ? 'disabled' : ''}>${done ? 'Изучено' : 'Исследовать'}</button>
        </div>`;
      }).join('')}
    </div></div>`).join('');
}

function completeTask(id, xp, fish) {
  if (doneTasks.includes(id)) return;
  doneTasks.push(id);
  userXP += xp;
  userFish += fish;
  updateUI();
}

$('feed-btn').onclick = () => {
  if (userFish <= 0) return alert('У вас нет рыбы! Повышайте уровень и выполняйте квесты.');
  if (hunger >= 100) return alert('Виктор сыт!');
  userFish--;
  hunger = Math.min(100, hunger + 25);
  updateMascotSprite(true);
  updateUI();
};

init();
</script>
</body>
</html>
